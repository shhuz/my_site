<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#42b883"/>
  <!-- 书本：两页向左右展开，中间书脊 -->
  <path d="M50 30
           C42 24, 28 24, 20 28
           L20 72
           C28 68, 42 68, 50 74 Z"
        fill="#ffffff"/>
  <path d="M50 30
           C58 24, 72 24, 80 28
           L80 72
           C72 68, 58 68, 50 74 Z"
        fill="#ffffff"/>
  <!-- 书页分隔线，增加书本质感 -->
  <path d="M50 30 L50 74" stroke="#42b883" stroke-width="4" stroke-linecap="round"/>
  <path d="M30 38 L42 35 M30 48 L42 45 M30 58 L42 55" stroke="#42b883" stroke-width="3" stroke-linecap="round"/>
  <path d="M70 38 L58 35 M70 48 L58 45 M70 58 L58 55" stroke="#42b883" stroke-width="3" stroke-linecap="round"/>
</svg>
